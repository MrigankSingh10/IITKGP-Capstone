[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"
[project]
name = "hr-policy-navigator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.25.5", "httpx==0.28.1", "pydantic==2.11.3", "numpy==2.2.4", "faiss-cpu==1.10.0", "tokenizers==0.21.1"]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.7"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
